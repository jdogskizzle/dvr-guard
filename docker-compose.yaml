# dvr-guard: records live TV itself and shares one tuner per channel between recordings and
# viewers. Settings come from .env (copy .env.example to .env and fill it in).
services:
  dvr-guard:
    build:
      context: .
      additional_contexts:
        formlogin: ${FORMLOGIN_SRC:-https://github.com/jdogskizzle/formlogin.git#v2.0.0}   # sign-in library; FORMLOGIN_SRC=<folder> to build from a local copy
    image: dvr-guard:local
    container_name: dvr-guard
    restart: unless-stopped
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    group_add:
      - "${EXTRA_GID:-${PGID}}"   # a group that can write to RECORD_DIR, if it's not PGID
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL:?set JELLYFIN_URL in .env}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in .env}
      - SOURCE_M3U=${SOURCE_M3U:?set SOURCE_M3U in .env}
      - PUBLIC_URL=${PUBLIC_URL:?set PUBLIC_URL in .env}
      - EXTRA_MINUTES=${EXTRA_MINUTES:-0}
      - DVR_USERNAME=${DVR_USERNAME:-}
      - DVR_PASSWORD_HASH=${DVR_PASSWORD_HASH:-}
      - TZ=${TZ:-UTC}
    volumes:
      - ./guard.py:/app/guard.py:ro
      - ./page.html:/app/page.html:ro
      - ./data:/data
      - ${RECORD_DIR:?set RECORD_DIR in .env}:/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/lineup.m3u', timeout=10)"]
      interval: 60s
    networks:
      - jellyfin

networks:
  jellyfin:
    name: ${DOCKER_NETWORK:?set DOCKER_NETWORK in .env}
    external: true
